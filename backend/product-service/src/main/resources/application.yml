spring:
  application:
      name: product-service
  datasource:
     url: jdbc:mysql://localhost:3306/product_db
     username: ${DB_USERNAME}
     password: ${DB_PASSWORD}
  jpa:
    hibernate:
        ddl-auto: update # learning only; production uses Flyway/Liquibase
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082


eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
     exposure:
       include: health,info