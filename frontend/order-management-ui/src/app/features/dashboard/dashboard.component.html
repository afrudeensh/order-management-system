<h2>
  Welcome, {{ auth.user()?.name }}
</h2>

<div class="dashboard-grid">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ counts().products }}
      </mat-card-title>

      <mat-card-subtitle>
        Products
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-actions>
      <a
        mat-button
        routerLink="/products"
      >
        View products
      </a>
    </mat-card-actions>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ counts().orders }}
      </mat-card-title>

      <mat-card-subtitle>
        My orders
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-actions>
      <a
        mat-button
        routerLink="/orders"
      >
        View orders
      </a>
    </mat-card-actions>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ counts().notifications }}
      </mat-card-title>

      <mat-card-subtitle>
        Notifications
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-actions>
      <a
        mat-button
        routerLink="/notifications"
      >
        View notifications
      </a>
    </mat-card-actions>
  </mat-card>
</div>
