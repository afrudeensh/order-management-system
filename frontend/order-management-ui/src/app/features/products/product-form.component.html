<mat-card class="form-card">
  <mat-card-title>
    {{ id ? 'Edit product' : 'New product' }}
  </mat-card-title>

  <mat-card-content>
    <form
      [formGroup]="form"
      (ngSubmit)="save()"
      class="stack"
    >
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>

        <input
          matInput
          formControlName="name"
        />

        <mat-error>
          Name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Price (INR)</mat-label>

        <input
          matInput
          type="number"
          formControlName="price"
        />

        <mat-error>
          Price must be at least 0.01
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Stock</mat-label>

        <input
          matInput
          type="number"
          formControlName="stock"
        />

        <mat-error>
          Stock cannot be negative
        </mat-error>
      </mat-form-field>

      @if (error()) {
        <p class="error">
          {{ error() }}
        </p>
      }

      <div class="row">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          Save
        </button>

        <a
          mat-button
          routerLink="/products"
        >
          Cancel
        </a>
      </div>
    </form>
  </mat-card-content>
</mat-card>
