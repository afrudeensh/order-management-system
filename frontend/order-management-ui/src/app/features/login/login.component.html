<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>
      {{ registerMode() ? 'Create account' : 'Sign in' }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="stack"
    >
      @if (registerMode()) {
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>

          <input
            matInput
            formControlName="name"
          />

          <mat-error>
            Name is required
          </mat-error>
        </mat-form-field>
      }

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
        />

        <mat-error>
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        />

        <mat-error>
          Minimum 8 characters
        </mat-error>
      </mat-form-field>

      @if (error()) {
        <p class="error">
          {{ error() }}
        </p>
      }

      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="loading()"
      >
        {{ registerMode() ? 'Register' : 'Login' }}
      </button>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-button
      type="button"
      (click)="toggle()"
    >
      {{
        registerMode()
          ? 'Have an account? Sign in'
          : 'New here? Register'
      }}
    </button>
  </mat-card-actions>
</mat-card>
