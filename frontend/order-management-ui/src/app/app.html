@if (auth.isLoggedIn()) { 
  <mat-toolbar color="primary" class="nav">
     <mat-icon>inventory_2</mat-icon>

      <span class="brand">Order Management</span>
      
      <a 
        mat-button
        routerLink="/dashboard"
        routerLinkActive="active"
       >
        Dashboard
        </a>

      <a
        mat-button
        routerLink="/products"
        routerLinkActive="active"
       >
        Products
         </a>
         
      <a 
        mat-button
        routerLink="/orders"
        routerLinkActive="active"
       >
        Orders
         </a>
         
      <a
        mat-button
        routerLink="/notifications"
        routerLinkActive="active"
        [matBadge]="store.unread()"
        [matBadgeHidden]="store.unread() === 0"
        matBadgeDescription="Unread notifications"
      >
      Notifications
     </a>
         
      <span class="spacer"></span> 

      <span class="who"> 
        {{ auth.user()?.name }}
        ({{ auth.user()?.role }})
       </span> 

      <button
        mat-stroked-button
         (click)="auth.logout()"
       >
       Logout 
      </button> 
      </mat-toolbar>
 }
 
<main class="page">
   <router-outlet />
</main>
